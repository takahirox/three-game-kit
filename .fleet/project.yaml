schema_version: 2
commands:
  relic-frontier:
    argv: ["pnpm", "run", "verify:relic-frontier"]
    cwd: "."
evaluators:
  - id: relic-frontier-acceptance
    provider_id: process.harness
    command_ref: relic-frontier
    criterion_ids: [relic-frontier-verified]
rules: []
paths:
  writable:
    - "showcases/relic-frontier/**"
    - "tests/relic-frontier.spec.ts"
    - "scripts/verify-relic-frontier-*.mjs"
    - "README.md"
    - "package.json"
  protected:
    - ".git/**"
    - ".env*"
    - ".github/workflows/**"
    - ".fleet/**"
  generated:
    - "dist/**"
    - "test-results/**"
verification:
  required: [relic-frontier]
  required_evaluators: [relic-frontier-acceptance]
  evidence_freshness: "exact_diff"
  review:
    required: true
    block_severities: [critical, high]
network:
  mode: "disabled"
  https_domains: []
  ports: []
install:
  ecosystems: []
  existing_lock: "deny"
  new_dependency: "deny"
  manifest_lock_mutation: "deny"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  host_global: "deny"
approvals:
  process_shell: "required"
  new_dependency: "deny"
  manifest_lock_mutation: "deny"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  promotion: "required"
worker:
  allowed: ["claude_code_cli"]
  allowed_strategy_ids: ["claude-opus-high", "claude-fable-high"]
  adaptive_routing: true
  local_backend: false
budgets:
  wall_seconds: 1800.0
  worker_turns: 8
  processes: 20
  download_bytes: 0
  artifact_bytes: 100000000
