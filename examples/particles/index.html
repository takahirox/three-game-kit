<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Particle atlas · Three Game Kit</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="renderer" aria-hidden="true"></canvas>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Show all effects"><span class="brand-mark">✳</span> THREE GAME KIT <span class="brand-divider">/</span> <span class="brand-secondary">EXPERIMENTS</span></a>
    <span class="live-indicator"><i></i> LIVE PARTICLES</span>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">A STUDY IN LIGHT & MOTION <span>VOL. 01 — 26 EFFECTS</span></p><h1>Particle <em>atlas.</em></h1></div>
      <p class="intro-copy">光と動きの、小さな実験室。<br>26のエフェクトを探索して、お気に入りを見つけよう。<br><span>クリックで拡大 · ← → で切り替え · Space で一時停止</span></p>
    </section>
    <nav class="filterbar" aria-label="Effect categories">
      <div class="filters"><button class="filter active" data-filter="ALL" aria-pressed="true">All effects <span>26</span></button><button class="filter" data-filter="NEW" aria-pressed="false">New <span>6</span></button><button class="filter" data-filter="COSMIC" aria-pressed="false">Cosmic</button><button class="filter" data-filter="MAGIC" aria-pressed="false">Magic</button><button class="filter" data-filter="ENERGY" aria-pressed="false">Energy</button><button class="filter" data-filter="FIRE" aria-pressed="false">Fire</button><button class="filter" data-filter="NATURE" aria-pressed="false">Nature</button></div>
      <span class="grid-hint">SELECT AN EXPERIMENT ↗</span>
    </nav>
    <section id="gallery" class="gallery" aria-label="26 animated particle effects"></section>
    <div class="endnote"><span>BUILT WITH THE THREE GAME KIT PARTICLE SYSTEM</span><span>26 WORLDS. ONE ENGINE.</span></div>
  </main>
  <section id="focus" class="focus" role="region" aria-labelledby="focus-title" hidden>
    <div class="focus-top"><button id="back" class="text-button">← All experiments</button><span id="focus-index"></span><button id="next" class="text-button">Next effect →</button></div>
    <label id="depth-sort-control" hidden><input id="depth-sort" type="checkbox"> Refine overlapping crystals</label>
    <div id="focus-preview" class="focus-preview" role="img"></div>
    <div class="focus-caption"><div><p id="focus-category" class="eyebrow"></p><h2 id="focus-title"></h2></div><p id="focus-description"></p></div>
  </section>
  <footer class="transport">
    <div class="transport-buttons"><button id="pause" class="control" aria-pressed="false"><span id="pause-icon">Ⅱ</span> <span id="pause-label">Pause</span></button><button id="burst" class="control">✳ Burst</button><button id="restart" class="control">↺ Restart</button></div>
    <label class="speed-control">SPEED <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="Animation speed"><span id="speed-value">1×</span></label>
    <output id="stats" aria-live="off">Preparing light…</output>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>
</html>
