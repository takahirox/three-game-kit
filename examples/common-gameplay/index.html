<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Three Game Kit common gameplay</title></head>
  <body>
    <button id="run" type="button">Run common gameplay</button>
    <section id="hud" aria-label="Game HUD">
      <div data-hud-screen="play">
        <span>Score: <output data-hud-bind="score">0</output></span>
        <span>Health: <output data-hud-bind="health">0</output>/<output data-hud-bind="maximumHealth">0</output></span>
        <span>Area events: <output data-hud-bind="extra:areaEvents">0</output></span>
        <button type="button" data-hud-action="pause">Pause</button>
      </div>
      <div data-hud-screen="menu">Menu</div>
    </section>
    <pre id="status">ready</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
